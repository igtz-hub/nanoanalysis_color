[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoanalysis_cm"
version = "0.2.0"
description = "nanoanalysis colourmaps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gigaanalysis>=0.5.1",
    "jupyter>=1.1.1",
    "openpyxl>=3.1.5",
    "pyqt5>=5.15.11",
    "scienceplots>=2.2.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]
